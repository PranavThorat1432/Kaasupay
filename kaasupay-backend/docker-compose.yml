
services:
  fake-bank:
    build: .
    command: ["node", "tools/fake-bank.js"]
    environment:
      NODE_ENV: production
      PORT: 4000
      FAKE_BANK_PORT: 4000
    expose:
      - "4000"
    ports:
      - "4000:4000"

  kaasupay-1:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URL: ${MONGO_URL:?MONGO_URL must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      ADMIN_KEY: ${ADMIN_KEY:?ADMIN_KEY must be set in .env}
      BANK_URL: http://fake-bank:4000
      INSTANCE_NAME: kaasupay-1
    expose:
      - "3000"
    depends_on:
      - fake-bank

  kaasupay-2:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URL: ${MONGO_URL:?MONGO_URL must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      ADMIN_KEY: ${ADMIN_KEY:?ADMIN_KEY must be set in .env}
      BANK_URL: http://fake-bank:4000
      INSTANCE_NAME: kaasupay-2
    expose:
      - "3000"
    depends_on:
      - fake-bank

  kaasupay-3:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URL: ${MONGO_URL:?MONGO_URL must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      ADMIN_KEY: ${ADMIN_KEY:?ADMIN_KEY must be set in .env}
      BANK_URL: http://fake-bank:4000
      INSTANCE_NAME: kaasupay-3
    expose:
      - "3000"
    depends_on:
      - fake-bank
  
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - kaasupay-1
      - kaasupay-2
      - kaasupay-3
